---
openapi: "3.0.0"
info:
  version: 1.0.0
  title: Path Level Parameter Test Api
  license:
    name: MIT
servers:
  - url: http://localhost:8080/v1
paths:
  /roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        description: The id of the role to retrieve
        schema:
          type: string
          format: uuid
    get:
      summary: Get a role by id
      operationId: getRole
      tags:
      - roles
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                type: string
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                type: string